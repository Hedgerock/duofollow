name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Build Connector
        run: npm --prefix extension run build
      - name: Check formatting
        run: npm run format:check
      - name: Build for GitHub Pages
        env:
          VITE_DUOFOLLOW_EXTENSION_ID: ${{ vars.VITE_DUOFOLLOW_EXTENSION_ID }}
        run: |
          if [ -z "$VITE_DUOFOLLOW_EXTENSION_ID" ]; then
            echo "::error::Set the VITE_DUOFOLLOW_EXTENSION_ID repository variable to the distributed extension ID."
            exit 1
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
