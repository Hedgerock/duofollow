name: Browser tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run integration and visual tests
        run: npm run test:browser:docker
      - name: Upload container resource report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-container-resources
          overwrite: true
          path: test-results/container-resources.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  edge:
    name: Playwright Microsoft Edge
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install msedge
      - run: npm run test:edge
      - name: Upload Edge failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-edge-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Firefox bridge, extension and interface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - run: npm run extension:firefox:lint
      - run: npm run test:firefox:extension
      - run: npm run test:firefox
      - name: Upload Firefox failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-firefox-test-results
          path: |
            test-results/
            firefox-test-results/
          if-no-files-found: ignore
          retention-days: 7
