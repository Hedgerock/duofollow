<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DuoFollow Connector</title>
    <link rel="stylesheet" href="access.css" />
    <script type="module" src="access.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" width="40" height="40" alt="" />
        <h1 data-message="accessTitle"></h1>
      </header>
      <p data-message="accessSession"></p>
      <p data-message="accessData"></p>
      <p data-message="accessRecurring"></p>
      <p>
        <a
          id="privacy-link"
          data-message="privacyLink"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </p>
      <p id="access-status" role="status" data-message="accessChecking"></p>
      <button id="grant-access" type="button" data-message="accessGrant" hidden></button>
      <button id="revoke-access" type="button" data-message="accessRevoke" hidden></button>
      <section id="quick-unfollow" aria-labelledby="quick-unfollow-title">
        <h2 id="quick-unfollow-title" data-message="quickUnfollowTitle"></h2>
        <p id="quick-unfollow-terms" data-message="quickUnfollowTerms"></p>
        <label class="access-checkbox">
          <input
            id="quick-unfollow-consent"
            type="checkbox"
            aria-describedby="quick-unfollow-terms"
            disabled
          />
          <span data-message="quickUnfollowEnable"></span>
        </label>
        <p id="quick-unfollow-status" role="status" hidden></p>
      </section>
    </main>
  </body>
</html>
