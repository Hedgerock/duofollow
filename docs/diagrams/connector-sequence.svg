<svg xmlns="http://www.w3.org/2000/svg" width="800" height="562" viewBox="0 0 1000 702" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
  <title id="title">Последовательность сетевых операций Connector</title>
  <desc id="desc">Connector проверяет общую паузу перед чтением и отправкой DELETE. При активной паузе возвращается RATE_LIMITED. После подтверждения отписки worker проверяет сессию, разрешения и подписку перед одним DELETE.</desc>
  <defs>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path fill="#84bcf3" d="m0 0 10 5-10 5z" />
    </marker>
    <marker id="arrow-write" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path fill="#98e66d" d="m0 0 10 5-10 5z" />
    </marker>
    <marker id="arrow-wait" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path fill="#f2c984" d="m0 0 10 5-10 5z" />
    </marker>
  </defs>

  <rect width="1000" height="702" rx="24" fill="#0b1220" />
  <g stroke="#435771" stroke-width="1.5" stroke-dasharray="5 6">
    <path d="M155 89v580 M500 89v580 M845 89v580" />
  </g>
  <g fill-opacity=".65">
    <rect x="35" y="141" width="930" height="82" rx="12" fill="#362636" stroke="#936271" />
    <rect x="35" y="374" width="930" height="293" rx="12" fill="#141e2e" stroke="#29374b" />
  </g>
  <g fill="#182436" stroke="#435771">
    <rect x="45" y="25" width="220" height="64" rx="12" />
    <rect x="390" y="25" width="220" height="64" rx="12" />
    <rect x="735" y="25" width="220" height="64" rx="12" />
    <rect x="360" y="502" width="280" height="49" rx="10" />
  </g>
  <g fill="#e8edf7" font-size="16" font-weight="650" text-anchor="middle">
    <text x="155" y="52">Интерфейс DuoFollow</text>
    <text x="500" y="52">Service worker</text>
    <text x="845" y="52">API Duolingo</text>
  </g>
  <g fill="#b9c7db" font-size="12.5" text-anchor="middle">
    <text x="155" y="72">Сайт и окно расширения</text>
    <text x="500" y="72">DuoFollow Connector</text>
    <text x="845" y="72">Профиль и подписки</text>
    <text x="500" y="523">Сессия, доступ и общая пауза</text>
    <text x="500" y="540">проверены перед отправкой</text>
  </g>

  <g fill="none" stroke-width="2">
    <g stroke="#84bcf3" marker-end="url(#arrow-read)">
      <path d="M155 125h345" />
      <path d="M500 267h345" />
      <path d="M845 302H500" stroke-dasharray="5 4" />
      <path d="M500 350H155" stroke-dasharray="5 4" />
      <path d="M155 432h345" />
      <path d="M500 470h345" />
      <path d="M845 490H500" stroke-dasharray="5 4" />
    </g>
    <g stroke="#98e66d" marker-end="url(#arrow-write)">
      <path d="M500 583h345" />
      <path d="M845 620H500" stroke-dasharray="5 4" />
      <path d="M500 650H155" stroke-dasharray="5 4" />
    </g>
    <g stroke="#f2c984" marker-end="url(#arrow-wait)">
      <path d="M500 205H155" stroke-dasharray="5 4" />
    </g>
  </g>

  <g fill="#e8edf7" font-size="14" text-anchor="middle">
    <text x="327" y="114">Сравнение или подготовка отписки</text>
    <text x="672" y="256">Чтение профиля и списков</text>
    <text x="672" y="291">Данные Duolingo</text>
    <text x="327" y="339">Результат или запрос подтверждения</text>
    <text x="327" y="421">Подтверждение выбранной отписки</text>
    <text x="672" y="459">Повторное чтение Following</text>
  </g>
  <g font-size="13" font-weight="650">
    <text x="55" y="162" fill="#f2c984">Действует общая пауза</text>
    <text x="55" y="250" fill="#b9c7db">Если паузы нет</text>
    <text x="55" y="396" fill="#84bcf3">Только для отписки</text>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="327" y="193" fill="#f2c984">RATE_LIMITED без запроса к API</text>
    <text x="672" y="572" fill="#98e66d">Один DELETE после проверок</text>
    <text x="672" y="609" fill="#e8edf7">Ответ Duolingo</text>
    <text x="327" y="639" fill="#e8edf7">Исход отписки</text>
  </g>
</svg>
