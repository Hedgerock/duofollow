<svg xmlns="http://www.w3.org/2000/svg" width="800" height="472" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
  <title id="title">Core, платформа и транспорт DuoFollow</title>
  <desc id="desc">Клиент сайта проверяет протокол и обращается к заменяемому транспорту. Вход расширения связывает Chromium-адаптер и общий core. Core проверяет отправителя, сессию и одноразовое подтверждение. Браузерные возможности доступны через ExtensionPlatform.</desc>
