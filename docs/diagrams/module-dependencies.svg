<svg xmlns="http://www.w3.org/2000/svg" width="800" height="439" viewBox="0 0 1030 565" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
  <title id="title">Карта зависимостей DuoFollow</title>
  <desc id="desc">SiteLayout объединяет интерфейс и рабочие хуки. DuoFollowConnector отправляет сообщения фоновому процессу расширения. Фоновый процесс проверяет доступ и выполняет чтение и отписку через API Duolingo.</desc>
